# The app is developed on Linux but shipped to people on Windows, where the
# scanner meets drive letters, NTFS case-insensitivity and C:\Windows. Nothing
# on a Linux box can prove that path works, so the suite runs on a real
# Windows runner too.
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The UI suite drives a real browser.
      - run: npx playwright install chromium

      - run: npm run build

      - name: API suite
        run: npm run test:api

      - name: UI suite
        run: npm run test:ui

      # What a Linux box cannot check: that the scanner actually enumerates
      # this machine's drives instead of looking for /run/media.
      - name: Drive detection on a real Windows filesystem
        shell: pwsh
        run: node tests/windows-roots.mjs

      # ffmpeg and ffprobe are the app's only external binaries. The runner
      # image does not ship them, and the media suite skips itself when they
      # are absent — so install them, or the step would pass by doing nothing.
      - name: Install ffmpeg
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress

      - name: Verify ffmpeg is actually on PATH
        shell: pwsh
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Media pipeline
        run: npm run test:media
        env:
          # Refuse to skip: a silent skip here is a green tick over no coverage.
          STUDYHUB_REQUIRE_FFMPEG: '1'

      # launch.bat is what a Windows user actually double-clicks, and nothing
      # had ever executed it — including the node one-liner it runs inside a
      # `for /f`, where cmd.exe quoting either works or fails silently.
      - name: launch.bat brings the app up
        shell: pwsh
        timeout-minutes: 6
        run: |
          $p = Start-Process cmd.exe -ArgumentList '/c','launch.bat' -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..60) {
            try {
              $r = Invoke-WebRequest 'http://127.0.0.1:47285/api/health' -TimeoutSec 3 -UseBasicParsing
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 2
          }
          if ($ok) {
            $page = Invoke-WebRequest 'http://127.0.0.1:47285/' -TimeoutSec 5 -UseBasicParsing
            if ($page.Content -notmatch '<div id="root"') {
              Write-Host 'served something, but not the app shell'
              $ok = $false
            }
          }
          # cmd.exe is only the parent; the server is its child.
          taskkill /T /F /PID $p.Id 2>$null | Out-Null
          if (-not $ok) { throw 'launch.bat did not bring the app up' }
          Write-Host 'launch.bat brought the app up and served the interface'
