<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Study Hub</title>
    <meta name="description" content="Local-first offline learning platform with cinema player and smart syllabus" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('study_hub_theme') || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Offline Client-Side Visual PPTX Presentation Rendering Engine -->
    <script src="/libs/jszip.min.js"></script>
    <script src="/libs/chart.umd.min.js"></script>
    <script src="/libs/PptxViewJS.min.js"></script>
  </head>
  <body class="bg-[#f9f9fb] dark:bg-[#070709] text-zinc-900 dark:text-zinc-100 font-sans antialiased overflow-x-hidden min-h-screen selection:bg-indigo-500/20 selection:text-indigo-600 dark:selection:text-indigo-400 transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
